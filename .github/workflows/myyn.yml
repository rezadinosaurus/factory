name: GCC Generate All Defconfigs

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Kernel repository"
        required: true
        default: "rezadinosaurus/android_kernel_qcom_sm8250"
      branch:
        description: "Kernel branch"
        required: true
        default: "lineage-base"

env:
  KBUILD_BUILD_USER: "lloromannic"
  KBUILD_BUILD_HOST: "stargaze"
  GCC_URL: "https://github.com/mvaisakh/gcc-build/releases/download/25102026/eva-gcc-arm64-25102026.xz"

jobs:
  defconfig:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repository }}
          ref: ${{ github.event.inputs.branch }}
          submodules: recursive

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses-dev bison flex libssl-dev libelf-dev bc \
            gcc-arm-linux-gnueabi python3 python-is-python3 git wget curl \
            device-tree-compiler zstd xz-utils zip

      - name: Setup Eva GCC
        shell: bash
        run: |
          set -e

          GCC_DIR="$GITHUB_WORKSPACE/tc/gcc"
          mkdir -p "$GCC_DIR"

          wget -q "$GCC_URL" -O "$GITHUB_WORKSPACE/eva-gcc.tar.xz"
          tar -xf "$GITHUB_WORKSPACE/eva-gcc.tar.xz" -C "$GCC_DIR" --strip-components=1
          rm -f "$GITHUB_WORKSPACE/eva-gcc.tar.xz"

          GCC_BIN="$(find "$GCC_DIR/bin" -maxdepth 1 -type f -name 'aarch64-*-gcc' | head -n1)"

          if [ -z "$GCC_BIN" ]; then
            echo "ERROR: Eva GCC compiler not found."
            find "$GCC_DIR" -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          GCC_PREFIX="${GCC_BIN%gcc}"

          echo "$GCC_DIR/bin" >> "$GITHUB_PATH"
          echo "GCC_DIR=$GCC_DIR" >> "$GITHUB_ENV"
          echo "GCC_PREFIX=$GCC_PREFIX" >> "$GITHUB_ENV"
          echo "TC_BIN=$GCC_DIR/bin" >> "$GITHUB_ENV"

          echo "GCC_PREFIX: $GCC_PREFIX"
          "$GCC_BIN" --version | head -n1

      - name: Generate all defconfigs
        shell: bash
        run: |
          set -e
          echo "GCC_PREFIX=$GCC_PREFIX"
          "${GCC_PREFIX}gcc" --version | head -n1

          chmod +x scripts/update_defconfig
          ./scripts/update_defconfig all

      - name: Verify generated defconfigs
        shell: bash
        run: |
          set -e

          DEVICES="alioth apollo cas cmi dagu elish enuma lmi munch umi thyme psyche"

          for DEVICE in $DEVICES; do
            echo "=== Verifying: $DEVICE ==="

            test -f "arch/arm64/configs/${DEVICE}_defconfig"
            rm -rf "verify-$DEVICE"

            make O="verify-$DEVICE" ARCH=arm64 \
              CROSS_COMPILE="$GCC_PREFIX" \
              CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
              CROSS_COMPILE_COMPAT="arm-linux-gnueabi-" \
              KCFLAGS="-Wno-error" \
              "${DEVICE}_defconfig" \
            || make O="verify-$DEVICE" ARCH=arm64 \
              CROSS_COMPILE="$GCC_PREFIX" \
              CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
              CROSS_COMPILE_COMPAT="arm-linux-gnueabi-" \
              KCFLAGS="-Wno-error" \
              "vendor/${DEVICE}_defconfig"

            rm -rf "verify-$DEVICE"
            echo "OK: $DEVICE"
          done

      - name: Show defconfig changes
        shell: bash
        run: |
          git status --short
          git diff -- arch/arm64/configs

      - name: Package all defconfigs
        shell: bash
        run: |
          set -e
          mkdir -p defconfig-output

          for DEVICE in alioth apollo cas cmi dagu elish enuma lmi munch umi thyme psyche; do
            cp "arch/arm64/configs/${DEVICE}_defconfig" "defconfig-output/${DEVICE}_defconfig"
          done

          (cd defconfig-output && zip -r ../defconfigs-all.zip .)
          ls -lh defconfigs-all.zip

      - name: Upload defconfigs
        uses: actions/upload-artifact@v4
        with:
          name: all-generated-defconfigs
          path: |
            defconfigs-all.zip
            defconfig-output/
          retention-days: 7
